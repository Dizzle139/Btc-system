name: Research
on:
  workflow_run:
    workflows: ["Data agent"]
    types: [completed]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas numpy
      - run: python research/run_all.py
      - run: cd research/moves && python mark_moves.py     # refresh the answer key the turn watch compares against
      - run: |
          git config user.name "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git pull --rebase || true
          git add research/results.md research/moves/moves.csv
          git commit -m "Research results $(date -u +%F)" || echo "no changes"
          git push
